name: CI

# Проверки запускаются на каждый пуш в любую ветку и на каждый pull request.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    name: Linters (black, isort, flake8, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: black
        run: black --check --diff .

      - name: isort
        run: isort --check-only --diff .

      - name: flake8
        run: flake8 .

      - name: mypy
        run: mypy app tests

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: pytest
        run: pytest -v
